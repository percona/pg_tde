[pytest]
testpaths = .
pythonpath = .
addopts = -ra --strict-markers
markers =
    needs_vault: needs an OpenBao/Vault keyring service
    needs_kmip: needs a KMIP keyring service
    needs_pgbackrest: needs pgbackrest on PATH
    needs_old_install: needs --old-pg-config
    linux_only: Linux only
    pg_min(n): minimum PostgreSQL major
    pg_max(n): maximum PostgreSQL major
    slow: long running
    bug(id): regression test for a ticket
    node_config(settings, initdb_args): server settings and initdb args for every node of the test
stormweaver_log_mode = unified
