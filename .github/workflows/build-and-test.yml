name: Reusable build and test
on:
  workflow_call:
    inputs:
      pg_version:
        type: string
        required: true
      runs-on:
        type: string
        required: true
      image-os:
        type: string
        required: false
        default: ''
      compiler:
        type: string
        required: true
      build_type:
        type: string
        required: true

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    container: &container
      image: >-
        ${{ inputs.image-os && format(
        'ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-{0}-{1}-{2}-{3}',
        inputs.pg_version, inputs.compiler, inputs.build_type, inputs.image-os) }}
      options: --init ${{ inputs.build_type == 'exec-backend' && '--security-opt seccomp=unconfined' || '' }}
    timeout-minutes: 30
    env:
      # No cosmian_kms package on macOS; let kmip.pl skip_all there.
      PG_TEST_REQUIRE_COSMIAN_KMS: ${{ startsWith(inputs.runs-on, 'macos-') && '0' || '1' }}
      PG_TEST_REQUIRE_OPENBAO: '1'

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          path: src
          submodules: recursive
          ref: ${{ github.ref }}

      - name: Clone postgres repository
        if: startsWith(inputs.runs-on, 'macos-')
        uses: actions/checkout@v7
        with:
          path: postgres
          repository: percona/postgres.git
          ref: PSP_REL_${{ inputs.pg_version }}_STABLE

      - name: Install dependencies for Ubuntu
        if: startsWith(inputs.image-os, 'ubuntu')
        run: src/ci_scripts/ubuntu-deps.sh

      - name: Install dependencies for MacOS
        if: startsWith(inputs.runs-on,  'macos-')
        run: src/ci_scripts/macos-deps.sh

      - name: Build postgres for MacOS
        if: startsWith(inputs.runs-on, 'macos-')
        working-directory: postgres
        env:
          CFLAGS: -O2
        run: |
          ./configure --prefix="$GITHUB_WORKSPACE/pginst" --enable-debug --enable-tap-tests \
            --enable-cassert --enable-injection-points
          make -s -j "$(sysctl -n hw.ncpu)" install-world
          make -s -j "$(sysctl -n hw.ncpu)" -C src/test/modules install

      - name: Build pg_tde
        run: src/ci_scripts/build.sh ${{ inputs.build_type }}

      - name: Test pg_tde
        run: src/ci_scripts/test.sh

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: log-test-${{ inputs.pg_version }}-${{ inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.build_type }}
          path: |
            build/meson-logs/testlog.txt
            build/regress_install
            build/regress_install.log
            build/regression.diffs
            build/results
            build/testrun
          retention-days: 3

  test-psp-with-tde:
    name: Test PSP with TDE enabled by default
    runs-on: ${{ inputs.runs-on }}
    container: *container
    timeout-minutes: 30
    # Skip PSP tests for MacOS because it doesn't support TDE archiving commands.
    if: ${{ ! startsWith(inputs.runs-on,  'macos-') }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          path: src
          submodules: recursive
          ref: ${{ github.ref }}

      - name: Install dependencies for Ubuntu
        if: startsWith(inputs.image-os, 'ubuntu')
        run: src/ci_scripts/ubuntu-deps.sh

      - name: Build pg_tde
        run: src/ci_scripts/build.sh ${{ inputs.build_type }}

      - name: Test postgres with TDE as default access method
        run: src/ci_scripts/test-global-tde.sh --continue

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: log-test-global-tde-${{ inputs.pg_version }}-${{ inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.build_type }}
          path: |
            /usr/local/pgsql/postgresql.log
            /opt/postgres/contrib/*/log
            /opt/postgres/contrib/*/regression.diffs
            /opt/postgres/contrib/*/regression.out
            /opt/postgres/contrib/*/results
            /opt/postgres/contrib/*/tmp_check
            /opt/postgres/src/bin/*/tmp_check
            /opt/postgres/src/test/*/log
            /opt/postgres/src/test/*/regression.diffs
            /opt/postgres/src/test/*/regression.out
            /opt/postgres/src/test/*/results
            /opt/postgres/src/test/*/tmp_check
          retention-days: 3
