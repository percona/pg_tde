name: Reusable build and test
on:
  workflow_call:
    inputs:
      pg_version:
        type: string
        required: true
      os:
        type: string
        required: true
      compiler:
        type: string
        required: true
      build_type:
        type: string
        required: true
      container:
        description: >-
          Run in the prebuilt CI image (percona-lab/pg_github_actions_images)
          that provides Percona Server for PostgreSQL, built for pg_version,
          compiler and build_type, and the common dependencies; ubuntu-deps.sh
          adds pg_tde's extras. Otherwise PostgreSQL is built on the runner.
        type: boolean
        required: false
        default: false

env:
  artifact_name: build-${{ inputs.pg_version }}-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.build_type }}
  CC: ${{ inputs.compiler }}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    container: &container
      # The image is the one matching the job's inputs, e.g.
      # postgres-source:psp-18-gcc-debugoptimized-ubuntu24.04, or none.
      image: >-
        ${{ inputs.container && format(
        'ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-{0}-{1}-{2}-ubuntu{3}',
        inputs.pg_version, inputs.compiler, inputs.build_type,
        fromJSON('{"ubuntu-22.04": "22.04", "ubuntu-24.04": "24.04", "ubuntu-24.04-arm": "24.04"}')[inputs.os]) || '' }}
      # EXEC_BACKEND requires ASLR to be turned off.
      options: ${{ inputs.build_type == 'exec-backend' && '--security-opt seccomp=unconfined' || '' }}
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          path: src
          submodules: recursive
          ref: ${{ github.ref }}

      # The image already contains the PostgreSQL tree, built and installed.
      - name: Clone postgres repository
        if: ${{ !inputs.container }}
        uses: actions/checkout@v6
        with:
          path: postgres
          repository: percona/postgres.git
          ref: PSP_REL_${{ inputs.pg_version }}_STABLE

      - name: Install dependencies for Ubuntu
        if: startsWith(inputs.os, 'ubuntu-')
        run: src/ci_scripts/ubuntu-deps.sh

      - name: Install dependencies for MacOS
        if: startsWith(inputs.os,  'macos-')
        run: src/ci_scripts/macos-deps.sh

      - name: Build postgres
        if: ${{ !inputs.container }}
        run: src/ci_scripts/build-and-install-psp.sh ${{ inputs.build_type }}

      - name: Build pg_tde
        run: src/ci_scripts/build.sh ${{ inputs.build_type }}

      - name: Add build and install to artifact tar file
        # In a container the PostgreSQL tree and installation come from the
        # image, which the test jobs use too.
        run: tar -czf artifacts.tar src build ${{ !inputs.container && 'postgres pginst' || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact_name }}
          overwrite: true
          path: |
            artifacts.tar
          retention-days: 1

  test:
    name: Test
    runs-on: ${{ inputs.os }}
    container: *container
    needs: build
    timeout-minutes: 20
    env:
      # No cosmian_kms package on macOS; let kmip.pl skip_all there.
      PG_TEST_REQUIRE_COSMIAN_KMS: ${{ startsWith(inputs.os, 'macos-') && '0' || '1' }}
      PG_TEST_REQUIRE_OPENBAO: '1'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.artifact_name }}
          path: .

      - name: Extract artifact file
        run: tar -xzf artifacts.tar

      - name: Install dependencies for Ubuntu
        if: startsWith(inputs.os, 'ubuntu-')
        run: src/ci_scripts/ubuntu-deps.sh

      - name: Install dependencies for MacOS
        if: startsWith(inputs.os,  'macos-')
        run: src/ci_scripts/macos-deps.sh

      # The image's installation does not contain pg_tde yet: the build job
      # installed it into its own container, which is gone.
      - name: Install pg_tde
        if: inputs.container
        run: meson install -C build

      - name: Test pg_tde
        run: src/ci_scripts/test.sh

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: log-test-${{ inputs.pg_version }}-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.build_type }}
          path: |
            build/meson-logs/testlog.txt
            build/regress_install
            build/regress_install.log
            build/regression.diffs
            build/results
            build/testrun
          retention-days: 3

  test-psp-with-tde:
    name: Test PSP with TDE enabled by default
    runs-on: ${{ inputs.os }}
    container: *container
    needs: build
    timeout-minutes: 30
    # Skip PSP tests for MacOS because it doesn't support TDE archiving commands.
    if: ${{ ! startsWith(inputs.os,  'macos-') }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.artifact_name }}
          path: .

      - name: Extract artifact file
        run: tar -xzf artifacts.tar

      - name: Install dependencies for Ubuntu
        run: src/ci_scripts/ubuntu-deps.sh

      # The image's installation does not contain pg_tde yet: the build job
      # installed it into its own container, which is gone.
      - name: Install pg_tde
        if: inputs.container
        run: meson install -C build

      # Lets the log upload below find the image's tree and installation at the
      # same workspace paths as on the runner.
      - name: Link prebuilt PostgreSQL into the workspace
        if: inputs.container
        run: ln -s "$PG_SOURCE_DIR" postgres && ln -s "$PG_INSTALL_DIR" pginst

      - name: Test postgres with TDE as default access method
        run: src/ci_scripts/test-global-tde.sh --continue

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: log-test-global-tde-${{ inputs.pg_version }}-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.build_type }}
          path: |
            pginst/postgresql.log
            postgres/contrib/*/log
            postgres/contrib/*/regression.diffs
            postgres/contrib/*/regression.out
            postgres/contrib/*/results
            postgres/contrib/*/tmp_check
            postgres/src/bin/*/tmp_check
            postgres/src/test/*/log
            postgres/src/test/*/regression.diffs
            postgres/src/test/*/regression.out
            postgres/src/test/*/results
            postgres/src/test/*/tmp_check
          retention-days: 3
