name: Format
on:
  pull_request:
    paths-ignore:
      - documentation/**

env:
  pg_version: 19

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    # The image already provides PostgreSQL plus the pgindent/pg_bsd_indent/
    # find_typedef/perltidyrc tooling this job exists to run. The tag is spelled
    # out because the `env` context is not available here; keep it in step
    # with pg_version above.
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-19-gcc-debugoptimized
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          path: src
          submodules: recursive

      - name: Install dependencies
        run: src/ci_scripts/ubuntu-deps.sh

      - name: Build pg_tde
        run: src/ci_scripts/build.sh debug

      - name: Update typedefs
        run: src/ci_scripts/dump-typedefs.sh

      - name: Run pgindent
        run: src/ci_scripts/run-pgindent.sh --check --diff

      - name: Run pgperltidy
        run: src/ci_scripts/run-pgperltidy.sh --assert-tidy --standard-error-output

      - name: Run clang-format
        run: src/ci_scripts/run-clang-format.sh --check
        env:
          CLANG_FORMAT: clang-format-22
