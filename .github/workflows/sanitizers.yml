name: Sanitizers
on:
  pull_request:
    paths-ignore:
      - documentation/**
  push:
    branches:
      - main
    paths-ignore:
      - documentation/**

# A new push to a PR supersedes the runs of its previous head. Other runs, such
# as pushes to main, each get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CC: clang
  CXX: clang++
  LD: clang
  # Avoid failures on slow recovery
  PGCTLTIMEOUT: 120
  PG_TEST_TIMEOUT_DEFAULT: 300

jobs:
  run:
    name: Run
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-18-clang-sanitize-ubuntu24.04
      options: --init --ulimit stack=67108864:67108864
    timeout-minutes: 15
    env:
      PG_TEST_REQUIRE_COSMIAN_KMS: '1'
      PG_TEST_REQUIRE_OPENBAO: '1'
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          path: src
          submodules: recursive

      - name: Install dependencies
        run: src/ci_scripts/ubuntu-deps.sh

      - name: Configure sanitizers
        run: |
          {
            echo "UBSAN_OPTIONS=log_path=$GITHUB_WORKSPACE/sanitize.log print_suppressions=0 print_stacktrace=1 print_summary=1 halt_on_error=1"
            echo "ASAN_OPTIONS=log_path=$GITHUB_WORKSPACE/sanitize.log print_suppressions=0 abort_on_error=1"
            echo "LSAN_OPTIONS=log_path=$GITHUB_WORKSPACE/sanitize.log print_suppressions=0 suppressions=$GITHUB_WORKSPACE/src/ci_scripts/suppressions/lsan.supp"
          } >> "$GITHUB_ENV"

      - name: Build pg_tde
        run: src/ci_scripts/build.sh sanitize

      - name: Run pg_tde tests
        run: src/ci_scripts/test.sh sanitize

      - name: Print sanitize logs
        if: ${{ !cancelled() }}
        run: cat sanitize.log.*

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: sanitizers-testlog
          path: |
            sanitize.log.*
            build/meson-logs/testlog.txt
            build/regress_install
            build/regress_install.log
            build/regression.diffs
            build/results
            build/testrun
          retention-days: 3
