name: Code coverage
on:
  pull_request:
    paths-ignore:
      - documentation/**
  push:
    branches:
      - main
    paths-ignore:
      - documentation/**

env:
  pg_version: 18
  # Avoid failures on slow recovery
  PGCTLTIMEOUT: 120
  PG_TEST_TIMEOUT_DEFAULT: 300

jobs:
  collect:
    name: Collect and upload
    runs-on: ubuntu-24.04
    # The tag is spelled out because the `env` context is not available here;
    # keep it in step with pg_version above.
    container:
      image: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-18-gcc-debugoptimized-ubuntu24.04
      # Reaps orphaned processes, e.g. a postmaster that a test SIGKILLs;
      # otherwise its PID stays taken and the restart fails.
      options: --init
    timeout-minutes: 10
    env:
      PG_TEST_REQUIRE_COSMIAN_KMS: '1'
      PG_TEST_REQUIRE_OPENBAO: '1'
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          path: src
          submodules: recursive

      - name: Install dependencies
        run: src/ci_scripts/ubuntu-deps.sh

      - name: Build pg_tde
        run: src/ci_scripts/build.sh coverage

      - name: Run pg_tde tests
        run: src/ci_scripts/test.sh

      - name: Process coverage
        run: |
          geninfo -o coverage.info --rc lcov_branch_coverage=1 --ignore-errors mismatch -i .
          geninfo -o coverage.info --rc lcov_branch_coverage=1 --ignore-errors mismatch .
        working-directory: build

      - name: Upload coverage data to codecov.io
        uses: codecov/codecov-action@v7
        with:
          verbose: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: ../build/coverage.info
          working-directory: src

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: coverage-testlog
          path: |
            build/meson-logs/testlog.txt
            build/regress_install
            build/regress_install.log
            build/regression.diffs
            build/results
            build/testrun
          retention-days: 3
